# ==========================================================================
# FOOD WARS - Game Requirements / Design Document
# Squelette évolutif - à compléter et ajuster au fil du développement
# ==========================================================================

game_meta:
  title: "Food Wars"
  target_session_length_min: 10
  platforms: [web, android, ios]
  tone: "compétitif, rythmé, ambiance cuisine chaotique mais lisible"
  visual_style:
    art_direction: ""            # ex: cartoon coloré / stylisé / réaliste
    ui_layout: "deux plans de travail face à face, cartes en bas d'écran"
    references: []               # jeux ou images d'inspiration
    color_palette: []            # à définir
  modes:
    - id: "food_wars"
      description: "Mode compétitif 1v1"
    - id: "exploration"
      description: "Découverte de recettes/ingrédients d'un pays avec un chef"

# --------------------------------------------------------------------------
# REGLES DE JEU - Food Wars
# --------------------------------------------------------------------------
game_rules:
  ingredient_budget: null          # points totaux disponibles par joueur - à définir
  ingredients_per_player:
    min: 3
    max: 6
  timeline_actions:
    min: 5
    max: 6
  random_events:
    frequency_window_min: 4        # 1 événement par tranche de 4 min
  cards:
    deck_size:
      min: 15
      max: 20
    starting_hand_size: null       # à définir
    draw_trigger: "action_transition"  # pioche sur changement d'activité (vs "fixed_interval")
    ratio_contextual_vs_global: "majorité contextuelle"  # à chiffrer précisément
  phases:
    planning_min: null             # ex: 2-3 min - à affiner
    execution_min: null            # ex: 5-6 min - à affiner
    judgment_min: null             # ex: ~1 min - à affiner

